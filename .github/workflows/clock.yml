name: Public clock control

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
    - cron: '9,19,29,39,49,59 * * * *'
  workflow_dispatch:

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print event and timestamps
        run: |
          echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          echo "utc=$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "shanghai=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
